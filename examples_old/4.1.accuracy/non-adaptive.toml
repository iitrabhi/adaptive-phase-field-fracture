[problem]
name = "3D glacier stress-based phase-field fracture"

[mesh]
path = "mesh/non-adaptive/mesh.xdmf"

[geometry]
Lx = 500.0
Ly = 750.0
Lz = 125.0

[finite_element]
displacement_family = "CG"
displacement_degree = 1
damage_family = "CG"
damage_degree = 1
history_family = "DG"
history_degree = 0

[material]
youngs_modulus = 9.5e9
poissons_ratio = 0.35
ice_density = 917.0
freshwater_density = 1000.0
seawater_density = 1020.0

[fracture]
length_scale = 10.0
critical_stress = 0.1185e6
energy_threshold = 10.0
zeta = 5.0
residual_stiffness = 1.0e-4

[loads.gravity]
enabled = true
acceleration = 9.81
direction = [0.0, 0.0, -1.0]

[loads.hydrostatic]
enabled = false
boundary = "right"
marker = 1
density_source = "seawater"
water_height_ratio = 0.5
component = 0
sign = -1.0
degree = 1


[[boundary_conditions]]
name = "bottom_roller"
boundary = "bottom"
type = "dirichlet"
component = 2
value = 0.0

[[boundary_conditions]]
name = "left_roller"
boundary = "left"
type = "dirichlet"
component = 0
value = 0.0

[[boundary_conditions]]
name = "front_roller"
boundary = "front"
type = "dirichlet"
component = 1
value = 0.0

[[boundary_conditions]]
name = "back_roller"
boundary = "back"
type = "dirichlet"
component = 1
value = 0.0

[adaptivity]
enabled = false
target_hmin = 2.5
damage_threshold = 0.6

[solver]
linear_solver = "gmres"
preconditioner = "hypre_euclid"
projection_linear_solver = "gmres"
projection_preconditioner = "hypre_euclid"
outer_tolerance = 1.0e-4
norm_zero_tolerance = 1.0e-14

[output]
directory = "output/non-adaptive"
filename = "output.xdmf"
write_every = 1
write_damage = true
write_displacement = true
functions_share_mesh = true
rewrite_function_mesh = true
flush_output = true

[logging]
level = "ERROR"
garbage_collect_every = 5
